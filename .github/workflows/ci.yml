name: CI

# Runs on the trunk and on every stabilization branch, so a `release/X.Y` branch and the bug
# fixes proposed onto it get the same build + lint gate as main. See RELEASING.md.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (swift build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        # Skelf targets macOS 26 / Liquid Glass, so it needs the macOS 26 SDK (Xcode 26+),
        # which the macos-26 runner image ships.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift build
        run: swift build -v

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
